        return {};
      }
      uint16_t current = (uint16_t) id(hp_operation_register).state;
      return (current & 0x0010) | (value & 0x000F);

switch:
  # Bit 4 du registre 1000
  - platform: modbus_controller
    modbus_controller_id: heatpump_modbus_controller
    name: "Heat Pump Power"
    id: hp_power_switch
    register_type: holding
    address: 1000
    bitmask: 0x0010
    entity_category: config

water_heater:
  - platform: template
    id: hp_pool_water_heater
    name: "Pool Heat Pump"
    current_temperature: !lambda |-
      return id(hp_water_in_temp).state;
    target_temperature: !lambda |-
      return id(hp_water_temp_setpoint).state;
    mode: !lambda |-
      if (!id(hp_power_switch).state || isnan(id(hp_operation_register).state)) {
        return water_heater::WATER_HEATER_MODE_OFF;
      }

      switch (((uint16_t) id(hp_operation_register).state) & 0x000F) {
        case 0:
          return static_cast<water_heater::WaterHeaterMode>(id(hp_last_water_heater_mode));
        case 3:
        case 6:
          id(hp_last_water_heater_mode) = water_heater::WATER_HEATER_MODE_PERFORMANCE;
          return water_heater::WATER_HEATER_MODE_PERFORMANCE;
        case 4:
        case 7:
          id(hp_last_water_heater_mode) = water_heater::WATER_HEATER_MODE_ECO;
          return water_heater::WATER_HEATER_MODE_ECO;
        case 1:
        case 2:
        case 5:
          id(hp_last_water_heater_mode) = water_heater::WATER_HEATER_MODE_HEAT_PUMP;
          return water_heater::WATER_HEATER_MODE_HEAT_PUMP;
        default:
          return water_heater::WATER_HEATER_MODE_OFF;
      }
    is_on: !lambda |-
      return id(hp_power_switch).state;
    optimistic: true
    restore_mode: NO_RESTORE
    supported_modes:
      - "OFF"
      - ECO
      - PERFORMANCE
      - HEAT_PUMP
    visual:
      min_temperature: 12
      max_temperature: 35
      target_temperature_step: 0.5
    set_action:
      - lambda: |-
          auto desired_mode = id(hp_pool_water_heater).get_mode();
          float desired_setpoint = id(hp_pool_water_heater).get_target_temperature();

          id(hp_last_water_heater_mode) = desired_mode;

          if (std::isnan(desired_setpoint)) {
            desired_setpoint = id(hp_water_temp_setpoint).state;
          }
          if (std::isnan(desired_setpoint)) {
            desired_setpoint = 27.0f;
          }

          if (desired_setpoint < 12.0f) {
            desired_setpoint = 12.0f;
          } else if (desired_setpoint > 35.0f) {
            desired_setpoint = 35.0f;
          }

          const uint16_t operation_code = isnan(id(hp_operation_register).state)
                                            ? 0
                                            : (((uint16_t) id(hp_operation_register).state) & 0x000F);
          const bool cooling_family = operation_code == 2 || operation_code == 3 || operation_code == 4;
          const bool auto_family = operation_code == 1;

          if (fabsf(id(hp_water_temp_setpoint).state - desired_setpoint) >= 0.1f) {
            auto setpoint_call = id(hp_water_temp_setpoint).make_call();
            setpoint_call.set_value(desired_setpoint);
            setpoint_call.perform();
          }

          std::string desired_option;
          if (desired_mode == water_heater::WATER_HEATER_MODE_OFF) {
            desired_option = "Standby";
          } else if (!id(hp_power_switch).state) {
            id(hp_power_switch).turn_on();
          }

          if (desired_mode == water_heater::WATER_HEATER_MODE_HEAT_PUMP) {
            if (cooling_family) {
              desired_option = "Cooling + Smart";
            } else if (auto_family) {
              desired_option = "Auto";
            } else {
              desired_option = "Heating + Smart";
            }
          } else if (desired_mode == water_heater::WATER_HEATER_MODE_PERFORMANCE) {
            desired_option = cooling_family ? "Cooling + Boost" : "Heating + Boost";
          } else if (desired_mode == water_heater::WATER_HEATER_MODE_ECO) {
            desired_option = cooling_family ? "Cooling + Eco" : "Heating + Eco";
          }

          if (!desired_option.empty() && id(hp_operation_mode_select).state != desired_option) {
            auto mode_call = id(hp_operation_mode_select).make_call();
            mode_call.set_option(desired_option);
            mode_call.perform();
          }