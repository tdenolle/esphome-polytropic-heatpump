  - platform: modbus_controller
    modbus_controller_id: heatpump_modbus_controller
    name: "Water Out Temp"
    address: 513
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: heatpump_modbus_controller
    name: "Coil Temp"
    address: 514
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: heatpump_modbus_controller
    name: "Ambient Temp"
    address: 515
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: heatpump_modbus_controller
    name: "IPM Temp"
    address: 516
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: heatpump_modbus_controller
    name: "AC Supply Voltage"
    id: hp_ac_supply_voltage
    address: 521
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 0
    state_class: measurement
    skip_updates: 3

  - platform: modbus_controller
    modbus_controller_id: heatpump_modbus_controller
    name: "AC Supply Current"
    id: hp_ac_supply_current
    address: 522
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 0
    state_class: measurement
    skip_updates: 3

  - platform: template
    name: "AC Supply Power"
    lambda: |-
      if (isnan(id(hp_ac_supply_voltage).state) || isnan(id(hp_ac_supply_current).state)) {
        return NAN;
      }
      return id(hp_ac_supply_voltage).state * id(hp_ac_supply_current).state;
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s

  - platform: modbus_controller
    modbus_controller_id: heatpump_modbus_controller
    name: "Compressor Failure Code"
    address: 523
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    skip_updates: 3

