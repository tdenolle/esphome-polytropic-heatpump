# WARNING:
# This ESPHome configuration is only valid for Polytropic heat pumps
# IVS / IVN / IVP / IVR manufactured in 2019 and later.
# You must request and verify the Modbus register table for your exact
# heat pump model with Polytropic support before using this file.
# Using an incorrect register table can damage your heat pump.


substitutions:
  name: esp32c3-heatpump-pool

esphome:
  name: ${name}
  friendly_name: ${name}
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio
    board_build.mcu: esp32c3
    board_build.variant: esp32c3

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

uart:
  rx_pin: GPIO20
  tx_pin: GPIO21
  baud_rate: 9600
  parity: NONE
  stop_bits: 1
  data_bits: 8
  #debug:
  #  direction: BOTH
  #  dummy_receiver: false
  #  after:
  #    delimiter: "\n"
  #  sequence:
  #    - lambda: UARTDebug::log_hex(direction, bytes, ':');

modbus:
  id: heatpump_modbus
  flow_control_pin: GPIO01

modbus_controller:
  - id: heatpump_modbus_controller
    address: 0x11  ## (17) address of the ModBUS slave device on the bus
    modbus_id: heatpump_modbus
    setup_priority: -10
    update_interval: 15s
    command_throttle: 500ms
    max_cmd_retries: 1

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  ap:
    ssid: ${name}
    password: !secret esp32c3_heatpump_pool_wifi_ap_password

captive_portal:

logger:
  level: INFO

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discover_ip: true
  discovery_object_id_generator: device_name
  topic_prefix: heatpump_pool/${name}
  publish_nan_as_none: true
  reboot_timeout: 0s
  log_topic:
    topic: heatpump_pool/${name}/logs
    level: INFO

ota:
  - platform : esphome
    password: !secret esp32c3_heatpump_pool_ota_password

globals:
  - id: hp_last_water_heater_mode
    type: int
    restore_value: no
    initial_value: '5'

