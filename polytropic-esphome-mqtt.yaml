text_sensor:

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    dns_address:
      name: "DNS Address"
    mac_address:
      name: "MAC Address"
    ssid:
      name: "SSID"

  - platform: template
    name: "Operation Mode"
    lambda: |-
      if (isnan(id(hp_operation_register).state)) {
        return {"unknown"};
      }
      switch (((uint16_t) id(hp_operation_register).state) & 0x000F) {
        case 0: return {"Standby"};
        case 1: return {"Auto"};
        case 2: return {"Cooling + Smart"};
        case 3: return {"Cooling + Boost"};
        case 4: return {"Cooling + Eco"};
        case 5: return {"Heating + Smart"};
        case 6: return {"Heating + Boost"};
        case 7: return {"Heating + Eco"};
        default: return {"Unknown"};
      }
    update_interval: 5s

  - platform: template
    name: "Unit Power State"
    lambda: |-
      if (isnan(id(hp_operation_register).state)) {
        return {"unknown"};
      }
      return (((uint16_t) id(hp_operation_register).state) & 0x0010) ? "On" : "Standby";
    update_interval: 5s

  - platform: template
    name: "Compressor Failure Label"
    lambda: |-
      if (isnan(id(hp_compressor_failure_code).state)) {
        return {"unknown"};
      }
      int code = (int) id(hp_compressor_failure_code).state;
      if (code <= 0) {
        return {"none"};
      }
      char buffer[8];
      snprintf(buffer, sizeof(buffer), "EA%02d", code);
      return {buffer};
    update_interval: 5s

